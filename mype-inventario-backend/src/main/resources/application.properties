spring.application.name=mype-inventario-backend
server.port=3000
spring.datasource.url=${DB_URL:jdbc:h2:file:${catalina.base:.}/data/mypeinventario;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
app.demo.email=${DEMO_EMAIL:admin@mype.pe}
app.demo.password=${DEMO_PASSWORD:Mype2026!}
